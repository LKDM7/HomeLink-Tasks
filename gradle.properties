# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.252
neo_version_range=[21.1.250,21.2)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
## Mod Properties
mod_id=homelink_tasks
mod_name=HomeLink Tasks
mod_license=Apache-2.0
mod_version=0.2.0
mod_group_id=fr.lkdm.homelink.tasks
mod_authors=LKDM
mod_description=Collaborative task boards, mind map and real crafting progress for a HomeLink base.
## Dependencies
# HomeCore supplies the device, network, permission, recipe description, production receipt
# and stock reading contracts this mod consumes. It is the only required dependency.
homecore_version=1.13.0
homecore_version_range=[1.13.0,2.0.0)

jei_version=19.57.0.449
jei_version_range=[19.0,)
rei_version=16.0.799
rei_version_range=[16.0,)
