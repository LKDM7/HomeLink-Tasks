name: Build and tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: HomeLinkTask
    steps:
      - uses: actions/checkout@v4
        with:
          path: HomeLinkTask
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LKDM7/HomeCore
          ref: dbcd1dc9fe694796780498ef1628903c89f6d04f
          path: HomeCore
          token: ${{ secrets.HOMELINK_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LKDM7/HomeLink-Storage
          ref: d7b8c7adbbff2a497ae1a5be6ffc77208d6f2fa5
          path: HomeLink Storage
          token: ${{ secrets.HOMELINK_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LKDM7/HomeLink-Energy
          ref: 57620158b6e29f47bccf951a6c253295dda73602
          path: HomeLinkEnergy
          token: ${{ secrets.HOMELINK_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the HomeCore API and its tests
        run: bash ../HomeCore/gradlew -p ../HomeCore build --no-daemon --no-configuration-cache
      - name: Build, unit tests and release archive
        run: bash gradlew build --no-daemon --no-configuration-cache
      - name: Runtime checks on a real server
        run: bash gradlew runGameTestServer --no-daemon --no-configuration-cache
      - name: Persistence write then read in separate processes
        run: |
          bash gradlew runGameTestServer -PpersistencePass=write --no-daemon --no-configuration-cache
          bash gradlew runGameTestServer -PpersistencePass=read --no-daemon --no-configuration-cache
      - name: Optional Storage integration
        run: bash gradlew build runGameTestServer -PwithStorage --no-daemon --no-configuration-cache
      - name: Verify the separate Storage distribution
        run: bash "../HomeLink Storage/gradlew" -p "../HomeLink Storage" build --no-daemon --no-configuration-cache
      - name: Preserve reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-validation
          path: |
            HomeLinkTask/build/reports/
            HomeLinkTask/build/test-results/
            HomeLinkTask/build/validation/**/logs/
            HomeLinkTask/build/validation/benchmark.json
      - name: Preserve release JARs separately
        uses: actions/upload-artifact@v4
        with:
          name: tasks-jars
          path: HomeLinkTask/build/libs/*.jar
